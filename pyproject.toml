[project]
name = "codeduck"
version = "0.1.0"
description = "Tree-sitter based Java code model exporter to DuckDB"
authors = [
    {name = "Evgeny Bokshitsky",email = "e.bokshitskiy@hh.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastmcp>=2.0",
    "pyarrow>=25.0.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pystolint-config-hh==1.1.0",
    "pystolint[pydantic]==0.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
codeduck = "codeduck.cli:main"


[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
name = "hhdev"
url = "https://devpi.pyn.ru/hh/hhdev/+simple/"

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://devpi.pyn.ru/root/pypi/+simple/"
default = true

[tool.uv.sources]
pystolint = { index = "hhdev" }
pystolint-config-hh = { index = "hhdev" }

[tool.pystolint.base_tool_config]
ruff = { package = "pystolint_config_hh", path = "config/ruff.toml" }
mypy = { package = "pystolint_config_hh", path = "config/mypy.toml" }

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"
addopts = '''
  --asyncio-mode=auto
  -p no:warnings
'''

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "FA",
]
ignore = [
    "UP035",
]
