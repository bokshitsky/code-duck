[project]
name = "codeduck"
version = "0.1.0"
description = "Java code model exporter to DuckDB"
authors = [
    {name = "Evgeny Bokshitsky",email = "e.bokshitskiy@hh.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastmcp>=2.0",
    "pyarrow>=25.0.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.15.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
codeduck = "codeduck.cli:main"


[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"
addopts = '''
  --asyncio-mode=auto
  -p no:warnings
'''

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'D100',
    'D101',
    'D102',
    'D103',
    'D104',
    'D105',
    'D106',
    'D107',
    'D203',
    'D212',
    'COM812',
    'S101',
    'PLW1514',
    'S310',
    'S404',
    'S603',
    'S607',
    'B008', # Вызов функции в качестве значения аргумента по умолчанию
    'RSE102',
    'RET504',
    'CPY',
    'RUF001',
    'RUF002',
    'RUF003',
    'RUF029',
    'RUF067',
    'PLR0913',
    'PLR0914',
    'PLR0917',
    'ARG',
    'FURB152',
    'TRY003',
    'EM102',
    'FBT001',
    'FBT002',
    'FBT003',
    'ANN',
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'INP001',
    'PLR2004',
    'PLR6301',
]

[tool.mypy]
strict = true
show_error_codes = true
follow_imports = 'silent'
follow_untyped_imports = true
disallow_any_explicit = true
enable_error_code = ['deprecated']
report_deprecated_as_note = true
